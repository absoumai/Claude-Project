<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PenNotes">
<meta name="theme-color" content="#0A0F1E">
<title>PenNotes</title>
<style>
  :root{
    --navy:#0A0F1E; --panel:#111A31; --line:#22304f;
    --cyan:#00FFFF; --violet:#8b5cf6; --green:#00ff88; --red:#ff3366; --amber:#ffb020;
    --paper:#fbf9f2; --rule:#dfe7f1; --muted:#93a4c4;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--navy); color:#eaf2ff;
    -webkit-touch-callout:none; -webkit-user-select:none; user-select:none}
  .app{display:flex; flex-direction:column; height:100%;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom)}

  .top{display:flex; align-items:center; gap:8px; padding:8px 12px;
    border-bottom:1px solid var(--line); background:var(--panel); flex:0 0 auto; overflow-x:auto}
  .brand{font-weight:800; letter-spacing:.4px; font-size:15px; color:var(--cyan); margin-right:2px}
  .spacer{flex:1}
  .btn{appearance:none; border:1px solid var(--line); background:#16203c; color:#eaf2ff;
    border-radius:12px; padding:10px 14px; font-size:15px; font-weight:600; min-height:44px;
    display:inline-flex; align-items:center; justify-content:center; gap:6px; cursor:pointer;
    flex:0 0 auto; white-space:nowrap}
  .btn:active{transform:scale(.97)}
  .btn.on{background:var(--cyan); color:#04121b; border-color:var(--cyan)}
  .btn.ghost{background:transparent}
  .btn.sm{padding:8px 10px; font-size:14px; min-height:38px}
  .btn.icon{font-size:17px; padding:8px 12px}
  .swatch{width:30px; height:30px; border-radius:50%; border:2px solid #2c3b5e; padding:0; flex:0 0 auto}
  .swatch.on{border-color:#fff; box-shadow:0 0 0 2px var(--cyan)}

  .legend{display:flex; gap:14px; padding:6px 12px; background:#0d1730; font-size:11.5px;
    color:var(--muted); border-bottom:1px solid var(--line); overflow-x:auto; flex:0 0 auto}
  .legend span{white-space:nowrap}
  .legend i{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px}

  .mid{flex:1 1 auto; display:flex; min-height:0}
  .rail{flex:0 0 auto; width:74px; background:var(--panel); border-right:1px solid var(--line);
    display:flex; flex-direction:column; gap:6px; padding:8px 6px; overflow-y:auto}
  .rail.hide{display:none}
  .rail .btn{width:100%; padding:8px 4px; font-size:11px; min-height:52px; flex-direction:column; gap:2px}
  .rail svg{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round}
  .railhead{font-size:10px; letter-spacing:.8px; color:var(--muted); text-align:center; margin:2px 0}

  .scroll{flex:1 1 auto; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
    background:#070c17; padding:10px; overscroll-behavior:contain}
  .padwrap{position:relative; margin:0 auto; max-width:1100px; border-radius:14px; overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.45)}
  /* touch-action MUST stay none: with pan-y, iPadOS lets the Pencil scroll the page
     mid-stroke. Finger scrolling over the canvas is done by hand in JS instead. */
  canvas#pad{display:block; width:100%; touch-action:none; background-color:var(--paper);
    background-image:repeating-linear-gradient(to bottom, transparent 0 43px, var(--rule) 43px 44px)}
  canvas#pad.grid{background-image:
    repeating-linear-gradient(to bottom, transparent 0 27px, var(--rule) 27px 28px),
    repeating-linear-gradient(to right, transparent 0 27px, var(--rule) 27px 28px)}
  .hint{position:absolute; left:18px; top:14px; color:#9fb0c9; font-size:17px; pointer-events:none}

  .bottom{flex:0 0 auto; background:var(--panel); border-top:1px solid var(--line)}
  .readrow{display:flex; align-items:flex-start; gap:10px; padding:8px 12px; border-bottom:1px solid var(--line)}
  .tag{flex:0 0 auto; font-size:11px; font-weight:800; letter-spacing:.8px; color:var(--navy);
    background:var(--cyan); border-radius:6px; padding:3px 6px; margin-top:2px}
  .tag.wait{background:#2c3b5e; color:var(--muted)}
  #readtext{flex:1; font-size:14px; line-height:1.4; color:#cfe0ff; max-height:56px; overflow:auto;
    white-space:pre-wrap; -webkit-user-select:text; user-select:text}
  .chips{display:flex; gap:6px; padding:0 12px 8px; flex-wrap:wrap}
  .chip{display:none; align-items:center; gap:8px; font-size:12.5px; background:#0d1730;
    border:1px solid var(--violet); color:#dbe7ff; border-radius:999px; padding:6px 10px}
  .chip.on{display:inline-flex}
  .chip b{color:var(--violet)}
  .chip button{background:none; border:0; color:var(--muted); font-size:16px; cursor:pointer; padding:0 2px}
  .actions{display:flex; gap:8px; padding:10px 12px; overflow-x:auto}
  .qbox{display:flex; gap:8px; padding:0 12px 10px}
  .qbox input{flex:1; background:#0d1730; border:1px solid var(--line); color:#eaf2ff;
    border-radius:12px; padding:12px 14px; font-size:16px; min-height:44px;
    -webkit-user-select:text; user-select:text}
  #markbtn{background:var(--violet); border-color:var(--violet); color:#fff; display:none}

  .sheet{position:fixed; inset:auto 0 0 0; max-height:86%; background:var(--panel);
    border-top:2px solid var(--cyan); border-radius:18px 18px 0 0; transform:translateY(110%);
    transition:transform .25s ease; z-index:40; display:flex; flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom)}
  .sheet.open{transform:translateY(0)}
  .shead{display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--line)}
  .shead b{font-size:16px}
  .sbody{padding:14px 16px 20px; overflow:auto; font-size:17px; line-height:1.55;
    -webkit-user-select:text; user-select:text}
  .sbody h3{color:var(--cyan); font-size:16px; margin:16px 0 6px}
  .sbody p{margin:0 0 10px}
  .sbody ul{margin:0 0 10px 18px; padding:0}
  .sbody li{margin:0 0 6px}
  .sbody strong{color:#fff}
  .sbody code{background:#0d1730; padding:2px 6px; border-radius:6px; font-size:15px;
    font-family:ui-monospace,Menlo,Consolas,monospace}
  .cmd{display:flex; align-items:center; gap:10px; background:#04121b; border:1px solid var(--green);
    border-radius:10px; padding:10px 12px; margin:0 0 8px; font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:15px; color:var(--green); overflow-x:auto}
  .cmd span{flex:1; white-space:pre; -webkit-user-select:text; user-select:text}
  .cmd button{flex:0 0 auto; background:#0d2b1e; border:1px solid var(--green); color:var(--green);
    border-radius:8px; padding:6px 10px; font-size:12px; font-weight:700; cursor:pointer}
  .ansbox{border:1px dashed var(--violet); border-radius:12px; padding:12px; margin-top:14px}
  .follow{display:none; gap:8px; padding:10px 14px; border-top:1px solid var(--line);
    overflow-x:auto; flex:0 0 auto}
  .follow.on{display:flex}
  .follow .btn{background:#16203c; border-color:var(--violet); color:#dcd2ff}
  .srcs{margin-top:16px; border-top:1px solid var(--line); padding-top:10px}
  .srcs h4{margin:0 0 6px; font-size:12px; letter-spacing:.6px; color:var(--muted)}
  .srcs a{display:block; color:var(--cyan); font-size:13.5px; margin:0 0 5px; text-decoration:none;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .spin{width:18px; height:18px; border:3px solid #2c3b5e; border-top-color:var(--cyan);
    border-radius:50%; animation:sp .8s linear infinite; display:inline-block;
    vertical-align:middle; margin-right:8px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .err{color:var(--red)}

  .mcq{border:1px solid var(--line); border-radius:14px; padding:12px; margin:0 0 12px}
  .mcq .qt{font-weight:700; margin-bottom:8px}
  .opt{display:flex; align-items:center; gap:10px; width:100%; text-align:left; margin:0 0 6px;
    background:#0d1730; border:1px solid var(--line); color:#eaf2ff; border-radius:10px;
    padding:10px 12px; font-size:16px; min-height:44px; cursor:pointer}
  .opt b{flex:0 0 auto; width:22px; color:var(--cyan)}
  .opt.pick{border-color:var(--cyan); background:#123}
  .opt.right{border-color:var(--green); background:rgba(0,255,136,.12)}
  .opt.wrong{border-color:var(--red); background:rgba(255,51,102,.12)}

  .mk{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line)}
  .mk .ic{flex:0 0 auto; width:26px; height:26px; border-radius:50%; display:flex;
    align-items:center; justify-content:center; font-weight:800; font-size:15px}
  .mk.ok .ic{background:rgba(0,255,136,.15); color:var(--green); border:1px solid var(--green)}
  .mk.no .ic{background:rgba(255,51,102,.15); color:var(--red); border:1px solid var(--red)}
  .mk.blank .ic{background:#2c3b5e; color:var(--muted); border:1px solid var(--line)}
  .mk div{flex:1; min-width:0}
  .mk small{display:block; color:var(--muted); font-size:13px; margin-top:2px}
  .score{font-size:20px; font-weight:800; color:var(--cyan); padding:12px 0 4px}

  .drawer{position:fixed; inset:0 auto 0 0; width:min(85%,340px); background:var(--panel);
    border-right:1px solid var(--line); transform:translateX(-105%); transition:transform .25s ease;
    z-index:50; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top)}
  .drawer.open{transform:translateX(0)}
  .drawer h4{margin:0; padding:14px; border-bottom:1px solid var(--line); font-size:15px}
  .notelist{overflow:auto; flex:1}
  .note{padding:12px 14px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center}
  .note div{flex:1; min-width:0}
  .note b{display:block; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .note small{color:var(--muted); font-size:12px}
  .scrim{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:45; display:none}
  .scrim.on{display:block}
  .toast{position:fixed; left:50%; bottom:120px; transform:translateX(-50%); background:#04121b;
    color:var(--cyan); border:1px solid var(--cyan); padding:10px 16px; border-radius:12px;
    font-size:14px; z-index:60; opacity:0; transition:opacity .2s; pointer-events:none}
  .toast.on{opacity:1}
  .menu{position:fixed; right:12px; top:60px; background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:6px; z-index:55; display:none; min-width:210px}
  .menu.on{display:block}
  .menu button{display:block; width:100%; text-align:left; background:none; border:0; color:#eaf2ff;
    padding:12px 14px; font-size:15px; border-radius:10px; cursor:pointer}
  .menu button:active{background:#16203c}

  /* ---------- portrait / narrow: wrap the bar, lay the rail flat ---------- */
  @media (orientation: portrait), (max-width: 820px){
    .top{flex-wrap:wrap; overflow-x:visible; gap:6px; padding:8px 10px}
    .top .spacer{display:none}
    .brand{font-size:14px}
    .btn.sm{padding:7px 10px; font-size:13.5px; min-height:38px}
    .swatch{width:27px; height:27px}
    .legend{gap:10px; font-size:11px}
    .mid{flex-direction:column}
    .rail{width:100%; flex-direction:row; gap:6px; overflow-x:auto; overflow-y:hidden;
      border-right:0; border-bottom:1px solid var(--line); padding:6px 8px}
    .rail .btn{width:auto; min-width:66px; min-height:48px}
    .railhead{display:none}
    .scroll{padding:8px}
    .sheet{max-height:78%}
    .sbody{font-size:16px}
  }

  /* ---------- short landscape (phone): claw back vertical space ---------- */
  @media (orientation: landscape) and (max-height: 560px){
    .legend{display:none}
    .sheet{max-height:94%}
    .btn{min-height:38px; padding:7px 11px; font-size:14px}
    .readrow{padding:6px 12px}
    #readtext{max-height:38px}
  }
</style>
</head>
<body>
<div class="app">

  <div class="top">
    <button class="btn sm ghost" id="menu">&#9776;</button>
    <span class="brand">PenNotes</span>
    <button class="btn sm" id="tPen">Pen</button>
    <button class="btn sm" id="tHi">Hilite</button>
    <button class="btn sm" id="tLasso">Circle</button>
    <button class="btn sm" id="tEr">Erase</button>
    <button class="btn sm ghost" id="railBtn">Shapes</button>
    <button class="swatch" data-c="#0d1b2a" style="background:#0d1b2a"></button>
    <button class="swatch" data-c="#1f6feb" style="background:#1f6feb"></button>
    <button class="swatch" data-c="#d92b2b" style="background:#d92b2b"></button>
    <span class="spacer"></span>
    <button class="btn sm ghost" id="undo">Undo</button>
    <button class="btn sm ghost" id="finger">Pen only</button>
    <button class="btn sm ghost" id="paste">Paste</button>
    <button class="btn sm ghost" id="newnote">New</button>
    <button class="btn sm" id="exportBtn">Export</button>
  </div>

  <div class="legend">
    <span><i style="background:#0d1b2a;border:1px solid #6b7a99"></i>black = your notes</span>
    <span><i style="background:#1f6feb"></i>blue = what is this?</span>
    <span><i style="background:#d92b2b"></i>red = I don't get it</span>
    <span><i style="background:#ffd600"></i>yellow = focus here</span>
    <span>Circle = ask about that bit only</span>
  </div>

  <div class="mid">
    <div class="rail hide" id="rail">
      <div class="railhead">SHAPES</div>
      <button class="btn" data-shape="line"><svg viewBox="0 0 24 24"><path d="M4 20 L20 4"/></svg>Line</button>
      <button class="btn" data-shape="arrow"><svg viewBox="0 0 24 24"><path d="M4 20 L20 4"/><path d="M20 4 L13 5"/><path d="M20 4 L19 11"/></svg>Arrow</button>
      <button class="btn" data-shape="rect"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12"/></svg>Box</button>
      <button class="btn" data-shape="circle"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>Circle</button>
      <button class="btn" data-shape="tri"><svg viewBox="0 0 24 24"><path d="M12 5 L20 19 L4 19 Z"/></svg>Triangle</button>
      <button class="btn" data-shape="axes"><svg viewBox="0 0 24 24"><path d="M4 20 L4 4"/><path d="M4 20 L20 20"/></svg>Axes</button>
      <div class="railhead">PAPER</div>
      <button class="btn" id="gridBtn"><svg viewBox="0 0 24 24"><path d="M4 10h16M4 16h16M10 4v16M16 4v16"/></svg>Grid</button>
    </div>

    <div class="scroll" id="scroll">
      <div class="padwrap">
        <canvas id="pad"></canvas>
        <div class="hint" id="hint">Write here with your Apple Pencil...</div>
      </div>
    </div>
  </div>

  <div class="bottom">
    <div class="readrow">
      <span class="tag wait" id="rtag">READING</span>
      <div id="readtext">Your handwriting appears here a moment after you stop writing.</div>
    </div>
    <div class="chips">
      <span class="chip" id="selchip"><b>Circled</b> <span id="selinfo">a bit of the page</span>
        <button id="selclear">&#215;</button></span>
      <span class="chip" id="pastechip"><b>Pasted</b> <span id="pasteinfo"></span>
        <button id="pasteclear">&#215;</button></span>
    </div>
    <div class="actions">
      <button class="btn" id="markbtn">Mark my answers</button>
      <button class="btn" data-mode="know" title="What / Why / When to use / How to defend">&#9432; Know more</button>
      <button class="btn" data-mode="terminal" title="Install and run commands">&gt;_ Terminal</button>
      <button class="btn" data-mode="explain">Explain simple</button>
      <button class="btn" data-mode="quiz">Quiz me</button>
      <button class="btn" data-mode="mcq">Multi-choice</button>
      <button class="btn" data-mode="summary">Summarise</button>
      <button class="btn" data-mode="cards">Flashcards</button>
      <button class="btn" data-mode="solve">Solve step by step</button>
      <button class="btn" data-mode="fix">Check my work</button>
    </div>
    <div class="qbox">
      <input id="q" placeholder="Or ask anything about this note..." enterkeyhint="send">
      <button class="btn on" id="send">Ask</button>
    </div>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="shead">
    <b id="stitle">Claude</b>
    <span class="spacer"></span>
    <button class="btn sm ghost" id="copyall">Copy</button>
    <button class="btn sm ghost" id="checkmcq" style="display:none">Check answers</button>
    <button class="btn sm ghost" id="showans" style="display:none">Show answers</button>
    <button class="btn sm ghost" id="closesheet">Close</button>
  </div>
  <div class="sbody" id="sbody"></div>
  <div class="follow" id="follow">
    <button class="btn" id="againbtn">Say it another way</button>
    <button class="btn" id="realbtn">Real-life example</button>
  </div>
</div>

<div class="menu" id="expmenu">
  <button data-exp="sheet">Study sheet (PDF)</button>
  <button data-exp="slides">Slide deck (PDF)</button>
  <button data-exp="png">Save the page as an image</button>
</div>

<div class="drawer" id="drawer">
  <h4>My notes</h4>
  <div class="notelist" id="notelist"></div>
  <div style="padding:12px; display:flex; gap:8px">
    <button class="btn sm" id="savenote">Save this note</button>
    <button class="btn sm ghost" id="closedrawer">Close</button>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var API = 'https://bydhtjspcdjdgrpjsotr.supabase.co/functions/v1/pennotes';
  var $ = function(id){ return document.getElementById(id); };
  var C = $('pad'), X = C.getContext('2d');
  var DPR = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
  var PAGE_H = 1500;

  var strokes = [], cur = null;
  var tool = 'pen', color = '#0d1b2a', penOnly = true;
  var recognized = '', lastSentCount = -1, readTimer = null, busy = false;
  var answersPart = '', lastAnswer = '';
  var quiz = null, mcq = null, sessionLog = [];
  var selection = null, hideSel = false, pasted = '';
  var panning = null;   // finger-drag scrolling, done by hand (see touch-action note in CSS)

  var SHAPES = { line:1, arrow:1, rect:1, circle:1, tri:1, axes:1 };

  /* ================= canvas ================= */
  function fit(){
    var w = C.parentElement.clientWidth;
    C.style.height = PAGE_H + 'px';
    C.width = Math.round(w * DPR);
    C.height = Math.round(PAGE_H * DPR);
    X.setTransform(DPR, 0, 0, DPR, 0, 0);
    redraw();
  }

  function drawShape(s){
    var x0 = s.x0, y0 = s.y0, x1 = s.x1, y1 = s.y1;
    X.beginPath();
    if(s.tool === 'line' || s.tool === 'arrow'){
      X.moveTo(x0, y0); X.lineTo(x1, y1); X.stroke();
      if(s.tool === 'arrow'){
        var a = Math.atan2(y1 - y0, x1 - x0), h = 16;
        X.beginPath();
        X.moveTo(x1, y1); X.lineTo(x1 - h*Math.cos(a - 0.4), y1 - h*Math.sin(a - 0.4));
        X.moveTo(x1, y1); X.lineTo(x1 - h*Math.cos(a + 0.4), y1 - h*Math.sin(a + 0.4));
        X.stroke();
      }
    } else if(s.tool === 'rect'){
      X.rect(Math.min(x0,x1), Math.min(y0,y1), Math.abs(x1-x0), Math.abs(y1-y0)); X.stroke();
    } else if(s.tool === 'circle'){
      X.ellipse((x0+x1)/2, (y0+y1)/2, Math.abs(x1-x0)/2, Math.abs(y1-y0)/2, 0, 0, 6.3); X.stroke();
    } else if(s.tool === 'tri'){
      X.moveTo((x0+x1)/2, y0); X.lineTo(x1, y1); X.lineTo(x0, y1); X.closePath(); X.stroke();
    } else if(s.tool === 'axes'){
      X.moveTo(x0, y0); X.lineTo(x0, y1); X.lineTo(x1, y1); X.stroke();
      X.beginPath();
      X.moveTo(x0, y0); X.lineTo(x0 - 6, y0 + 12); X.moveTo(x0, y0); X.lineTo(x0 + 6, y0 + 12);
      X.moveTo(x1, y1); X.lineTo(x1 - 12, y1 - 6); X.moveTo(x1, y1); X.lineTo(x1 - 12, y1 + 6);
      X.stroke();
    }
  }

  function drawStroke(s){
    X.save();
    X.lineCap = 'round'; X.lineJoin = 'round';
    if(s.tool === 'erase'){ X.globalCompositeOperation = 'destination-out'; X.strokeStyle = 'rgba(0,0,0,1)'; }
    else if(s.tool === 'hi'){ X.globalCompositeOperation = 'multiply'; X.strokeStyle = 'rgba(255,214,0,.45)'; }
    else { X.globalCompositeOperation = 'source-over'; X.strokeStyle = s.color; }

    if(SHAPES[s.tool]){ X.lineWidth = s.w; drawShape(s); X.restore(); return; }

    var p = s.pts; if(!p || !p.length){ X.restore(); return; }
    if(p.length === 1){
      X.beginPath(); X.arc(p[0].x, p[0].y, s.w * (p[0].p || .5), 0, 6.3);
      X.fillStyle = X.strokeStyle; X.fill(); X.restore(); return;
    }
    for(var i = 1; i < p.length; i++){
      var a = p[i-1], b = p[i];
      var pr = (a.p + b.p) / 2 || .5;
      X.lineWidth = (s.tool === 'erase') ? s.w : Math.max(.7, s.w * (.45 + pr * 1.25));
      X.beginPath(); X.moveTo(a.x, a.y); X.lineTo(b.x, b.y); X.stroke();
    }
    X.restore();
  }

  function drawSelOutline(){
    if(!selection || hideSel) return;
    X.save();
    X.setLineDash([9, 7]); X.lineWidth = 2; X.strokeStyle = '#8b5cf6';
    X.beginPath();
    X.moveTo(selection.pts[0].x, selection.pts[0].y);
    for(var i=1;i<selection.pts.length;i++) X.lineTo(selection.pts[i].x, selection.pts[i].y);
    X.closePath(); X.stroke();
    X.restore();
  }

  function redraw(){
    X.setTransform(1,0,0,1,0,0); X.clearRect(0,0,C.width,C.height);
    X.setTransform(DPR,0,0,DPR,0,0);
    for(var i=0;i<strokes.length;i++) drawStroke(strokes[i]);
    drawSelOutline();
    $('hint').style.display = strokes.length ? 'none' : 'block';
  }

  function widthFor(){
    if(tool === 'erase') return 26;
    if(tool === 'hi') return 20;
    if(SHAPES[tool]) return 2.4;
    return 2.6;
  }
  function pos(e){
    var r = C.getBoundingClientRect();
    return { x:(e.clientX - r.left), y:(e.clientY - r.top),
             p:(e.pressure && e.pressure > 0 ? e.pressure : .5) };
  }
  function accepts(e){
    if(e.pointerType === 'pen' || e.pointerType === 'mouse') return true;
    return !penOnly;
  }

  C.addEventListener('pointerdown', function(e){
    if(!accepts(e)){
      // Pen-only mode: a finger on the page scrolls it instead of drawing.
      if(penOnly && e.pointerType === 'touch'){
        panning = { y: e.clientY, top: $('scroll').scrollTop };
        C.setPointerCapture(e.pointerId);
      }
      return;
    }
    e.preventDefault(); C.setPointerCapture(e.pointerId);
    var p = pos(e);
    if(tool === 'lasso'){ cur = { lasso:true, pts:[p] }; redraw(); return; }
    if(SHAPES[tool]) cur = { tool:tool, color:color, w:widthFor(), x0:p.x, y0:p.y, x1:p.x, y1:p.y };
    else cur = { tool:tool, color:color, w:widthFor(), pts:[p] };
    strokes.push(cur); redraw();
  });
  C.addEventListener('pointermove', function(e){
    if(panning && e.pointerType === 'touch'){
      e.preventDefault();
      $('scroll').scrollTop = panning.top - (e.clientY - panning.y);
      return;
    }
    if(!cur || !accepts(e)) return;
    e.preventDefault();
    if(cur.lasso){
      cur.pts.push(pos(e));
      selection = cur; redraw(); return;
    }
    if(SHAPES[cur.tool]){ var p = pos(e); cur.x1 = p.x; cur.y1 = p.y; }
    else {
      var pts = (e.getCoalescedEvents ? e.getCoalescedEvents() : [e]);
      for(var i=0;i<pts.length;i++) cur.pts.push(pos(pts[i]));
    }
    redraw();
  });
  function endStroke(){
    panning = null;
    if(!cur) return;
    if(cur.lasso){
      if(cur.pts.length < 6){ selection = null; }
      else { selection = cur; showSel(); }
      cur = null; redraw(); return;
    }
    cur = null; scheduleRead();
  }

  /* ============ export (whole page or just the circled part) ============ */
  function bounds(){
    var minx=1e9, miny=1e9, maxx=-1e9, maxy=-1e9, seen=false, i, j;
    for(i=0;i<strokes.length;i++){
      var s = strokes[i];
      if(s.tool === 'erase' || s.lasso) continue;
      if(SHAPES[s.tool]){
        seen = true;
        minx = Math.min(minx, s.x0, s.x1); maxx = Math.max(maxx, s.x0, s.x1);
        miny = Math.min(miny, s.y0, s.y1); maxy = Math.max(maxy, s.y0, s.y1);
      } else if(s.pts){
        for(j=0;j<s.pts.length;j++){
          seen = true;
          var p = s.pts[j];
          if(p.x<minx) minx=p.x; if(p.x>maxx) maxx=p.x;
          if(p.y<miny) miny=p.y; if(p.y>maxy) maxy=p.y;
        }
      }
    }
    return seen ? {minx:minx, miny:miny, maxx:maxx, maxy:maxy} : null;
  }
  function selBounds(){
    var p = selection.pts, minx=1e9, miny=1e9, maxx=-1e9, maxy=-1e9;
    for(var i=0;i<p.length;i++){
      if(p[i].x<minx) minx=p[i].x; if(p[i].x>maxx) maxx=p[i].x;
      if(p[i].y<miny) miny=p[i].y; if(p[i].y>maxy) maxy=p[i].y;
    }
    return {minx:minx, miny:miny, maxx:maxx, maxy:maxy};
  }

  function exportCanvas(useSel){
    var b = (useSel && selection) ? selBounds() : bounds();
    if(!b) return null;
    var pad = useSel && selection ? 8 : 26, cssW = C.width / DPR;
    var minx = Math.max(0, b.minx - pad), miny = Math.max(0, b.miny - pad);
    var maxx = Math.min(cssW, b.maxx + pad), maxy = Math.min(PAGE_H, b.maxy + pad);
    var w = Math.max(8, maxx - minx), h = Math.max(8, maxy - miny);
    var scale = Math.min(2, Math.max(1, 1400 / w));

    hideSel = true; redraw();
    var o = document.createElement('canvas');
    o.width = Math.round(w * scale); o.height = Math.round(h * scale);
    var ox = o.getContext('2d');
    ox.fillStyle = '#ffffff'; ox.fillRect(0, 0, o.width, o.height);
    if(useSel && selection){
      ox.save(); ox.beginPath();
      var p = selection.pts;
      ox.moveTo((p[0].x - minx) * scale, (p[0].y - miny) * scale);
      for(var i=1;i<p.length;i++) ox.lineTo((p[i].x - minx) * scale, (p[i].y - miny) * scale);
      ox.closePath(); ox.clip();
    }
    ox.drawImage(C, minx*DPR, miny*DPR, w*DPR, h*DPR, 0, 0, o.width, o.height);
    if(useSel && selection) ox.restore();
    hideSel = false; redraw();
    return o;
  }
  function exportPNG(useSel){
    var o = exportCanvas(useSel);
    return o ? o.toDataURL('image/png').split(',')[1] : null;
  }

  /* ================= API ================= */
  function pass(){
    var p = localStorage.getItem('pn_pass');
    if(!p){
      p = window.prompt('Passcode (one time on this iPad):') || '';
      if(p) localStorage.setItem('pn_pass', p);

  }
  function call(mode, question, extra, cb){
    var img = exportPNG(mode !== 'read');
    if(!img){ cb({ error:'Write something on the page first.' }); return; }
    fetch(API, {
      method:'POST',
      headers:{ 'content-type':'application/json', 'x-pass':pass() },
      body:JSON.stringify({ mode:mode, image:img, question:question||'', text:recognized,
                            extra:extra||'', pasted:pasted,
                            selected:(mode !== 'read' && !!selection) })
    }).then(function(r){
      return r.json().catch(function(){ return { error:'Server error (HTTP ' + r.status + ')' }; });
    }).then(cb).catch(function(e){ cb({ error:'Network: ' + e.message }); });
  }

  function scheduleRead(){ clearTimeout(readTimer); readTimer = setTimeout(doRead, 1600); }
  function doRead(){
    var count = 0;
    for(var i=0;i<strokes.length;i++) count += (strokes[i].pts ? strokes[i].pts.length : 2);
    if(count === lastSentCount || !strokes.length) return;
    lastSentCount = count;
    $('rtag').className = 'tag wait'; $('rtag').textContent = 'READING';
    call('read', '', '', function(res){
      if(res.error){
        $('rtag').className = 'tag wait'; $('rtag').textContent = 'ERROR';
        $('readtext').innerHTML = '<span class="err">' + esc(res.error) + '</span>';
        return;
      }
      recognized = (res.text || '').trim();
      $('rtag').className = 'tag'; $('rtag').textContent = 'READ';
      $('readtext').textContent = recognized || '(nothing readable yet)';
    });

  /* ================= rendering ================= */
  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function bold(t){
    var parts = t.split('**'), o = '';
    for(var i=0;i<parts.length;i++) o += (i % 2 ? '<strong>' + parts[i] + '</strong>' : parts[i]);
    return o;
  }
  function inlineCode(t){
    var parts = t.split('`'), o = '';
    for(var i=0;i<parts.length;i++) o += (i % 2 ? '<code>' + parts[i] + '</code>' : parts[i]);
    return o;
  }
  function md(s){
    var lines = esc(s).split('\n'), out = '', inList = false, i, raw, t;
    for(i=0;i<lines.length;i++){
      raw = lines[i].trim();
      if(raw === ''){ if(inList){ out += '</ul>'; inList = false; } continue; }

      // a whole line that is one command -> copyable command row
      var m = raw.match(/^`(.+)`$/);
      if(m){
        if(inList){ out += '</ul>'; inList = false; }
        out += '<div class="cmd"><span>' + m[1] + '</span>' +
               '<button data-cmd="' + m[1].replace(/"/g,'&quot;') + '">Copy</button></div>';
        continue;
      }
      t = inlineCode(bold(raw));
      if(t.indexOf('### ') === 0 || t.indexOf('## ') === 0 || t.indexOf('# ') === 0){
        if(inList){ out += '</ul>'; inList = false; }
        out += '<h3>' + t.substring(t.indexOf(' ') + 1) + '</h3>';
      } else if(t.indexOf('- ') === 0 || t.indexOf('* ') === 0){
        if(!inList){ out += '<ul>'; inList = true; }
        out += '<li>' + t.substring(2) + '</li>';
      } else {
        if(inList){ out += '</ul>'; inList = false; }
        out += '<p>' + t + '</p>';
      }
    }
    if(inList) out += '</ul>';
    return out;
  }

  function run(mode, question){
    if(busy) return;

  /* ================= multi choice ================= */
  function renderMCQ(t){
    var head = t, key = '', cut = t.indexOf('--ANSWERS--');
    if(cut > -1){ head = t.substring(0, cut); key = t.substring(cut + 11); }

    var items = [], curItem = null;
    head.split('\n').forEach(function(raw){
      var l = raw.trim(); if(!l) return;
      var mo = l.match(/^([A-D])[).]\s*(.+)$/);
      var mq = l.match(/^Q?\s*(\d+)[.)]\s*(.+)$/);
      if(mo && curItem){ curItem.opts.push({ letter: mo[1], text: mo[2] }); }
      else if(mq){ curItem = { q: mq[2], opts: [], correct: '', why: '' }; items.push(curItem); }
    });
    key.split('\n').forEach(function(raw){
      var m = raw.trim().match(/^(\d+)[).]?\s*[-:]?\s*([A-D])\b\s*[-–—:]?\s*(.*)$/);
      if(m && items[+m[1] - 1]){ items[+m[1] - 1].correct = m[2]; items[+m[1] - 1].why = m[3] || ''; }
    });
    if(!items.length){ $('sbody').innerHTML = md(t); return; }

    mcq = { items: items, picks: {} }; quiz = null;
    $('markbtn').style.display = 'inline-flex';
    $('markbtn').textContent = 'Mark what I wrote';
    $('checkmcq').style.display = 'inline-flex';

    var h = '';
    items.forEach(function(it, i){
      h += '<div class="mcq" data-i="' + i + '"><div class="qt">' + (i+1) + '. ' + esc(it.q) + '</div>';
      it.opts.forEach(function(o){
        h += '<button class="opt" data-q="' + i + '" data-l="' + o.letter + '">' +
             '<b>' + o.letter + '</b><span>' + esc(o.text) + '</span></button>';
      });
      h += '</div>';
    });
    $('sbody').innerHTML = h;

    var opts = $('sbody').querySelectorAll('.opt');
    for(var k=0;k<opts.length;k++){
      opts[k].onclick = function(){
        var qi = this.getAttribute('data-q');
        var sibs = $('sbody').querySelectorAll('.opt[data-q="' + qi + '"]');
        for(var m=0;m<sibs.length;m++) sibs[m].classList.remove('pick');
        this.classList.add('pick');
        mcq.picks[qi] = this.getAttribute('data-l');
      };
    }
  }

  $('checkmcq').onclick = function(){
    if(!mcq) return;
    var right = 0;
    mcq.items.forEach(function(it, i){
      var sibs = $('sbody').querySelectorAll('.opt[data-q="' + i + '"]');
      for(var m=0;m<sibs.length;m++){
        var L = sibs[m].getAttribute('data-l');
        if(L === it.correct) sibs[m].classList.add('right');
        if(mcq.picks[i] === L && L !== it.correct) sibs[m].classList.add('wrong');
      }
      if(mcq.picks[i] === it.correct) right++;
      if(it.why){

        if(box) box.insertAdjacentHTML('beforeend',

  /* ================= marking ================= */
  function renderMarks(t){
    var rows = [], score = '';
    t.split('\n').forEach(function(raw){
      var l = raw.trim(); if(!l) return;
      if(/^SCORE:/i.test(l)){ score = l.replace(/^SCORE:\s*/i, ''); return; }
      var p = l.split('|');
      if(p.length >= 3){
        rows.push({ n: p[0].trim(), verdict: p[1].trim().toUpperCase(),
                    got: (p[2] || '').trim(), note: (p[3] || '').trim() });
      }
    });
    if(!rows.length){ $('sbody').innerHTML = md(t); return; }

    var h = score ? '<div class="score">Score: ' + esc(score) + '</div>' : '';
    rows.forEach(function(r){
      var cls = r.verdict === 'RIGHT' ? 'ok' : (r.verdict === 'BLANK' ? 'blank' : 'no');
      var ic  = r.verdict === 'RIGHT' ? '&#10003;' : (r.verdict === 'BLANK' ? '&ndash;' : '&#10007;');
      h += '<div class="mk ' + cls + '"><div class="ic">' + ic + '</div><div>' +
           '<b>Q' + esc(r.n) + '</b> &nbsp;' +
           (r.got ? 'you wrote: ' + esc(r.got) : '<span style="color:var(--muted)">nothing written</span>') +
           (r.note ? '<small>' + esc(r.note) + '</small>' : '') +
           '</div></div>';
    });
    $('sbody').innerHTML = h;
  }

    $('rtag').className = 'tag wait'; $('rtag').textContent = 'READING';
  };

  /* ================= export ================= */
  $('exportBtn').onclick = function(e){ e.stopPropagation(); $('expmenu').classList.toggle('on'); };
  document.addEventListener('click', function(){ $('expmenu').classList.remove('on'); });
  $('expmenu').addEventListener('click', function(e){ e.stopPropagation(); });
  var expBtns = $('expmenu').querySelectorAll('[data-exp]');
  for(var x=0;x<expBtns.length;x++){
    (function(b){
      b.onclick = function(){ $('expmenu').classList.remove('on'); doExport(b.getAttribute('data-exp')); };
    })(expBtns[x]);
  }
  function noteTitle(){ return (recognized.split('\n')[0] || 'My note').slice(0, 60); }

  function doExport(kind){
    var o = exportCanvas(false);
    if(!o){ toast('Write something first'); return; }
    var img = o.toDataURL('image/png');

    if(kind === 'png'){
      var a = document.createElement('a');
      a.href = img; a.download = noteTitle().replace(/[^a-z0-9]+/gi, '-') + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      toast('Saved as image'); return;
    }

    var w = window.open('', '_blank');
    if(!w){ toast('Allow pop-ups to export'); return; }
    var slide = (kind === 'slides');
    var css =
      'body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#111;margin:0}' +
      'h1{font-size:26px;margin:0 0 6px}h2{font-size:19px;color:#0b6;margin:18px 0 6px}' +
      'h3{font-size:17px;margin:14px 0 4px}p,li{font-size:15px;line-height:1.5}' +
      'code{background:#f0f2f6;padding:2px 5px;border-radius:4px;font-size:14px}' +
      '.cmd{background:#0b1020;color:#7CFFB2;padding:10px 12px;border-radius:8px;margin:0 0 8px;' +
      'font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;overflow-x:auto}' +
      '.cmd button{display:none}' +
      'img{max-width:100%;border:1px solid #ddd;border-radius:8px}.sec{padding:28px 34px}' +
      (slide ? '@page{size:landscape}.sec{page-break-after:always;min-height:92vh;display:flex;' +
               'flex-direction:column;justify-content:center}' : '@page{margin:16mm}') +
      '.meta{color:#777;font-size:12px;margin-bottom:18px}';

    var h = '<!doctype html><html><head><meta charset="utf-8"><title>' + esc(noteTitle()) +
            '</title><style>' + css + '</style></head><body>';
    h += '<div class="sec"><h1>' + esc(noteTitle()) + '</h1><div class="meta">PenNotes &middot; ' +
         new Date().toLocaleString() + '</div><img src="' + img + '"></div>';
    if(recognized){
      h += '<div class="sec"><h2>What the note says</h2><p>' +
           esc(recognized).replace(/\n/g, '<br>') + '</p></div>';
    }
    sessionLog.forEach(function(entry){
      h += '<div class="sec"><h2>' + esc(entry.title) + '</h2>' + md(entry.text) + '</div>';
    });
    h += '</body></html>';
    w.document.open(); w.document.write(h); w.document.close();
    setTimeout(function(){ try{ w.focus(); w.print(); }catch(e){} }, 700);
  }

  /* ================= saved notes ================= */
  function notes(){
    try { return JSON.parse(localStorage.getItem('pn_notes') || '[]'); } catch(e){ return []; }
  }
  function saveNotes(n){
    try { localStorage.setItem('pn_notes', JSON.stringify(n)); }
    catch(e){ toast('Storage full - delete an old note'); }
  }
  function renderNotes(){
    var n = notes(), h = '', i;
    if(!n.length) h = '<div class="note"><div><small>No saved notes yet.</small></div></div>';
    for(i=0;i<n.length;i++){
      h += '<div class="note"><div><b>' + esc(n[i].title || 'Untitled') + '</b>' +
           '<small>' + new Date(n[i].t).toLocaleString() + '</small></div>' +
           '<button class="btn sm" data-open="' + i + '">Open</button>' +
           '<button class="btn sm ghost" data-del="' + i + '">&#215;</button></div>';
    }
    $('notelist').innerHTML = h;
    var o = $('notelist').querySelectorAll('[data-open]');
    for(var a=0;a<o.length;a++){
      (function(b){
        b.onclick = function(){
          var n2 = notes()[Number(b.getAttribute('data-open'))];
          strokes = n2.s || []; recognized = n2.title || ''; lastSentCount = -1; selection = null;
          redraw(); $('readtext').textContent = recognized; drawer(false); toast('Note opened');
        };
      })(o[a]);
    }
    var d = $('notelist').querySelectorAll('[data-del]');
    for(var c=0;c<d.length;c++){
      (function(b){
        b.onclick = function(){
          var n2 = notes(); n2.splice(Number(b.getAttribute('data-del')), 1);
          saveNotes(n2); renderNotes();
        };
      })(d[c]);
    }
  }
  $('savenote').onclick = function(){
    if(!strokes.length){ toast('Nothing to save'); return; }
    var n = notes();
    n.unshift({ t:Date.now(), title:noteTitle(), s:strokes });
    saveNotes(n.slice(0,40)); renderNotes(); toast('Saved');
  };
  function drawer(open){
    $('drawer').classList.toggle('open', open);
    $('scrim').classList.toggle('on', open);
    if(open) renderNotes();
  }
  $('menu').onclick = function(){ drawer(true); };
  $('closedrawer').onclick = function(){ drawer(false); };
  $('scrim').onclick = function(){ drawer(false); };

  var toastT;
  function toast(m){
    var t = $('toast'); t.textContent = m; t.classList.add('on');
    clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('on'); }, 1600);
  }

  document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
  fit();
})();
</script>
</body>
</html>
